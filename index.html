<script>
/* ===== core.js : 천문 계산 · 만세력 · 대운/세운/월운 ===== */
var TG = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var TGK = ['갑','을','병','정','무','기','경','신','임','계'];
var DZ = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var DZK = ['자','축','인','묘','진','사','오','미','신','유','술','해'];
var WXN = ['목','화','토','금','수'];
var WXH = ['木','火','土','金','水'];
var WX_TG = [0,0,1,1,2,2,3,3,4,4];
var WX_DZ = [4,2,0,0,2,1,1,2,3,3,2,4];
var ANIMAL = ['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];
/* 지장간 : 여기 → 중기 → 정기 순서 [천간idx, 일수] */
var JJG = [
  [[8,10],[9,20]],
  [[9,9],[7,3],[5,18]],
  [[4,7],[2,7],[0,16]],
  [[0,10],[1,20]],
  [[1,9],[9,3],[4,18]],
  [[4,7],[6,7],[2,16]],
  [[2,10],[5,9],[3,11]],
  [[3,9],[1,3],[5,18]],
  [[4,7],[8,7],[6,16]],
  [[6,10],[7,20]],
  [[7,9],[3,3],[4,18]],
  [[4,7],[0,7],[8,16]]
];
function jjgMain(z){ var a=JJG[z]; return a[a.length-1][0]; }




var JEOL_NAMES = {315:'입춘',345:'경칩',15:'청명',45:'입하',75:'망종',105:'소서',135:'입추',165:'백로',195:'한로',225:'입동',255:'대설',285:'소한'};
var TERM24 = ['입춘','우수','경칩','춘분','청명','곡우','입하','소만','망종','하지','소서','대서','입추','처서','백로','추분','한로','상강','입동','소설','대설','동지','소한','대한'];




function mod(a,n){ return ((a%n)+n)%n; }
function rad(d){ return d*Math.PI/180; }




function jdFromYMDHMS(y,m,d,h,mi,s){
  var a=Math.floor((14-m)/12), y2=y+4800-a, m2=m+12*a-3;
  var jdn=d+Math.floor((153*m2+2)/5)+365*y2+Math.floor(y2/4)-Math.floor(y2/100)+Math.floor(y2/400)-32045;
  return jdn-0.5+(h+mi/60+(s||0)/3600)/24;
}
function ymdFromJD(jd){ /* returns UTC components */
  var z=Math.floor(jd+0.5), f=jd+0.5-z, a=z;
  if(z>=2299161){ var al=Math.floor((z-1867216.25)/36524.25); a=z+1+al-Math.floor(al/4); }
  var b=a+1524, c=Math.floor((b-122.1)/365.25), d=Math.floor(365.25*c), e=Math.floor((b-d)/30.6001);
  var day=b-d-Math.floor(30.6001*e), month=e<14?e-1:e-13, year=month>2?c-4716:c-4715;
  var secs=Math.round(f*86400), hh=Math.floor(secs/3600), mm=Math.floor((secs%3600)/60), ss=secs%60;
  if(hh>=24){ hh=0; }
  return {y:year,m:month,d:day,h:hh,mi:mm,s:ss};
}
/* ΔT (초) : Espenak & Meeus */
function deltaT(y){
  var t;
  if(y<1920){ t=y-1900; return -2.79+1.494119*t-0.0598939*t*t+0.0061966*t*t*t-0.000197*t*t*t*t; }
  if(y<1941){ t=y-1920; return 21.20+0.84493*t-0.076100*t*t+0.0020936*t*t*t; }
  if(y<1961){ t=y-1950; return 29.07+0.407*t-t*t/233+t*t*t/2547; }
  if(y<1986){ t=y-1975; return 45.45+1.067*t-t*t/260-t*t*t/718; }
  if(y<2005){ t=y-2000; return 63.86+0.3345*t-0.060374*t*t+0.0017275*t*t*t+0.000651814*t*t*t*t+0.00002373599*t*t*t*t*t; }
  if(y<2050){ t=y-2000; return 62.92+0.32217*t+0.005589*t*t; }
  if(y<2150){ return -20+32*Math.pow((y-1820)/100,2)-0.5628*(2150-y); }
  return 69;
}
/* 태양 겉보기 황경 (도). jde = 역학시(TT) 율리우스일 */
function sunLonBase(jde){
  var T=(jde-2451545)/36525;
  var L0=280.46646+36000.76983*T+0.0003032*T*T;
  var M=357.52911+35999.05029*T-0.0001537*T*T;
  var Mr=rad(M);
  var C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(Mr)+(0.019993-0.000101*T)*Math.sin(2*Mr)+0.000289*Math.sin(3*Mr);
  var om=125.04-1934.136*T;
  return mod(L0+C-0.00569-0.00478*Math.sin(rad(om)),360);
}
function sunLonTT(jde){
  var T=(jde-2451545)/36525;
  var lam=sunLonBase(jde);
  var lr=rad(lam);
  /* 정밀 춘분·하지·추분·동지 공식(Meeus 27장)에 맞춰 최소제곱으로 구한 보정항 */
  var corr=-0.002107-0.00002*Math.cos(lr)+0.000209*Math.sin(lr)-0.000764*T
    +(-0.001276*Math.cos(rad(153.23+22518.7541*T))+0.000421*Math.sin(rad(153.23+22518.7541*T)))
    +( 0.001232*Math.cos(rad(216.57+45037.5082*T))-0.000915*Math.sin(rad(216.57+45037.5082*T)))
    +(-0.001779*Math.cos(rad(312.69+32964.3577*T))+0.000843*Math.sin(rad(312.69+32964.3577*T)))
    +( 0.000002*Math.cos(rad(297.85+445267.1115*T))+0.001792*Math.sin(rad(297.85+445267.1115*T)))
    +( 0.000498*Math.cos(rad(353.40+65928.7155*T))-0.000581*Math.sin(rad(353.40+65928.7155*T)));
  return mod(lam+corr,360);
}
function sunLonUT(jdUT,y){ return sunLonTT(jdUT+deltaT(y)/86400); }




/* 목표 황경(lonT)에 이르는 UT 율리우스일 (guess 부근) */
function solveSunLon(lonT, guessJD, yHint){
  var jd=guessJD;
  for(var i=0;i<12;i++){
    var l=sunLonUT(jd,yHint);
    var d=mod(lonT-l+180,360)-180;
    jd+=d/0.9856474;
    if(Math.abs(d)<1e-7) break;
  }
  return jd;
}
/* y년의 절/기 (입춘=315° 부터) */
function termTime(y, lon){
  var base=jdFromYMDHMS(y,2,4,0,0,0);
  var off=mod(lon-315,360)/360*365.2422;
  return solveSunLon(lon, base+off, y);
}
function jdToKST(jd){ return ymdFromJD(jd+9/24); }
function fmtKST(jd){ var o=jdToKST(jd); return o.y+'.'+p2(o.m)+'.'+p2(o.d)+' '+p2(o.h)+':'+p2(o.mi); }
function p2(n){ return (n<10?'0':'')+n; }




/* ===== 한국 표준시 이력 ===== */
function cmpDate(y,m,d,y2,m2,d2){ return (y*10000+m*100+d)-(y2*10000+m2*100+d2); }
var KR_DST = [
  [1948,6,1,1948,9,13],[1949,4,3,1949,9,11],[1950,4,1,1950,9,10],[1951,5,6,1951,9,9],
  [1955,5,5,1955,9,9],[1956,5,20,1956,9,30],[1957,5,5,1957,9,22],[1958,5,4,1958,9,21],
  [1959,5,3,1959,9,20],[1960,5,1,1960,9,18],[1987,5,10,1987,10,11],[1988,5,8,1988,10,9]
];
function krLegalOffsetMin(y,m,d,useDST){
  var base;
  if(cmpDate(y,m,d,1908,4,1)<0) base=508;
  else if(cmpDate(y,m,d,1912,1,1)<0) base=510;
  else if(cmpDate(y,m,d,1954,3,21)<0) base=540;
  else if(cmpDate(y,m,d,1961,8,10)<0) base=510;
  else base=540;
  var dst=false;
  if(useDST){
    for(var i=0;i<KR_DST.length;i++){
      var r=KR_DST[i];
      if(cmpDate(y,m,d,r[0],r[1],r[2])>=0 && cmpDate(y,m,d,r[3],r[4],r[5])<=0){ dst=true; break; }
    }
  }
  return {base:base, dst:dst, total:base+(dst?60:0)};
}
/* 균시차(분) */
function equationOfTimeMin(jdUT){
  var T=(jdUT-2451545)/36525;
  var L0=mod(280.46646+36000.76983*T,360), M=mod(357.52911+35999.05029*T,360);
  var e=0.016708634-0.000042037*T;
  var eps=23.439291-0.0130042*T;
  var y=Math.pow(Math.tan(rad(eps/2)),2);
  var l0=rad(L0), m=rad(M);
  var E=y*Math.sin(2*l0)-2*e*Math.sin(m)+4*e*y*Math.sin(m)*Math.cos(2*l0)-0.5*y*y*Math.sin(4*l0)-1.25*e*e*Math.sin(2*m);
  return E*180/Math.PI*4;
}




/* ===== 사주 산출 ===== */
function dayIndexFromYMD(y,m,d){
  var a=Math.floor((14-m)/12), y2=y+4800-a, m2=m+12*a-3;
  var jdn=d+Math.floor((153*m2+2)/5)+365*y2+Math.floor(y2/4)-Math.floor(y2/100)+Math.floor(y2/400)-32045;
  return mod(jdn+49,60);
}
function addDays(y,m,d,n){
  var jd=jdFromYMDHMS(y,m,d,12,0,0)+n; var o=ymdFromJD(jd); return {y:o.y,m:o.m,d:o.d};
}
function ganzhi(idx){ return {g:idx%10, z:idx%12, idx:idx}; }
function gzName(idx){ return TG[idx%10]+DZ[idx%12]; }
function gzKor(idx){ return TGK[idx%10]+DZK[idx%12]; }
function gzFromGZ(g,z){ for(var i=0;i<60;i++){ if(i%10===g&&i%12===z) return i; } return -1; }




/*
 input: {name, gender:'M'|'F', y,m,d,h,mi, lon, utcOffsetMin(optional manual), place, correction:'none'|'lon'|'lon_eot', dayChange:'zero'|'23', dst:true}
*/
function computeSaju(inp){
  var opt=inp;
  var legal, offsetMin;
  if(opt.manualOffset!=null){ offsetMin=opt.manualOffset; legal={base:offsetMin,dst:false,total:offsetMin}; }
  else { legal=krLegalOffsetMin(opt.y,opt.m,opt.d,opt.dst!==false); offsetMin=legal.total; }
  var jdLocalClock=jdFromYMDHMS(opt.y,opt.m,opt.d,opt.h,opt.mi,0);
  var jdUT=jdLocalClock-offsetMin/1440;                 /* 실제 순간 (UT) */
  var lon=opt.lon!=null?opt.lon:126.98;
  var corrMin=0, corrDetail={};
  if(opt.correction!=='none'){

    // 정밀 경도 보정(-32분) 대신 관용적으로 쓰이는 -30분을 기본으로 하여

    corrMin = (lon >= 124 && lon <= 132) ? -30 : (lon - stdMer) * 4;

  }

  var s=ymdFromJD(jdSolar);                               /* "벽시계 형태"의 보정 시각 */




  /* 일주 */
  var dy=s.y, dm=s.m, dd=s.d, hourDec=s.h+s.mi/60;

  var hZ=Math.floor(mod(hourDec+1,24)/2);

  /* 연주·월주 (절기 기준: 실제 순간 jdUT) */
  var lam=sunLonUT(jdUT,s.y);
  var mIdx=Math.floor(mod(lam-315,360)/30);   /* 0=寅 */
  var yInfo=ymdFromJD(jdUT+9/24);
  var sajuYear=yInfo.y;
  var ipchunThis=termTime(sajuYear,315);

  var mG=(mStart+mIdx)%10, mZ=(2+mIdx)%12;
  var mIdxGZ=gzFromGZ(mG,mZ);
  var hIdxGZ=gzFromGZ(hG,hZ);




  var prevLon=mod(315+mIdx*30,360), nextLon=mod(prevLon+30,360);
  var prevJD=solveSunLon(prevLon, jdUT-mod(lam-prevLon,360)/0.9856474, s.y);
  var nextJD=solveSunLon(nextLon, jdUT+mod(nextLon-lam,360)/0.9856474, s.y);
  var nearestMin=Math.min(Math.abs(jdUT-prevJD),Math.abs(nextJD-jdUT))*1440;




  var res={
    input:opt, legal:legal, offsetMin:offsetMin, corrMin:corrMin, corrDetail:corrDetail,
    jdUT:jdUT, solar:s, sajuYear:sajuYear, sunLon:lam,
    pillars:[ganzhi(yIdx),ganzhi(mIdxGZ),ganzhi(dayIdx),ganzhi(hIdxGZ)],
    dayShift:dayShift,
    prevJeolJD:prevJD, nextJeolJD:nextJD, prevJeolName:JEOL_NAMES[prevLon], nextJeolName:JEOL_NAMES[nextLon],
    nearBoundaryMin:nearestMin, mIdx:mIdx
  };
  res.dm=dayIdx%10;
  res.gender=opt.gender;
  return res;
}

function computeDaewoon(sj){

  var diffDays = forward ? (sj.nextJeolJD-sj.jdUT) : (sj.jdUT-sj.prevJeolJD);
  var yearsExact = diffDays/3;
  var n = Math.max(1, Math.round(yearsExact));
  var list=[]; var mi=sj.pillars[1].idx;
  for(var k=1;k<=10;k++){
    var idx=mod(mi+(forward?k:-k),60);
    var startYears=yearsExact+(k-1)*10;
    var startJD=sj.jdUT+startYears*365.2422;
    var sd=jdToKST(startJD);
    list.push({k:k, idx:idx, startAge:startYears, endAge:startYears+10, startJD:startJD, startYear:sd.y, startDate:sd, daewoonNum:n+(k-1)*10});

  if(geonrok){ name='건록격'; basis='월지가 일간의 건록('+DZ[mz]+')'; }
  else if(yangin){ name='양인격'; basis='월지가 일간의 양인('+DZ[mz]+')'; }
  else {
    var pick=null;
    for(var k=stems.length-1;k>=0;k--){ if(heavenly.indexOf(stems[k][0])>=0){ pick=stems[k][0]; break; } }
    var gi=(pick==null)?main:pick;
    var s=sipsung(dm,gi);
    if(s===0||s===1){ /* 비겁 투출은 격이 아님 → 정기가 비겁이면 건록·월겁, 아니면 다음 */
      var alt=null; for(var q=stems.length-1;q>=0;q--){ var ss=sipsung(dm,stems[q][0]); if(ss>1 && heavenly.indexOf(stems[q][0])>=0){ alt=stems[q][0]; break; } }
      if(alt!=null){ gi=alt; s=sipsung(dm,alt); } else if(s<=1){ gi=main; s=sipsung(dm,main); }
    }
    var gname=['비견격','월겁격','식신격','상관격','편재격','정재격','편관격(칠살격)','정관격','편인격','정인격'][s];
    name=gname;

var BAD_REL=['충','형','삼형','파','해','원진','귀문','자형'];
function relSentence(c,e,label){
  var dm=dmOf(c), lz=e.lz;
  if(e.type==='삼형'){
    return label+'의 '+DZ[lz]+'가 원국의 두 글자와 만나 삼형('+e.name+')을 이룹니다. '+REL_TEXT['삼형']+'. 특히 법적 시비·계약 분쟁·수술·교통사고처럼 날카로운 일에 대비하고, 무리한 결정을 피하는 것이 좋습니다.';
  }
  if(e.type==='삼합'||e.type==='방합'||e.type==='반합'){
    var role=roleOfEl(c,e.wx);
    var tail=(role==='용신'||role==='희신')?'모이는 오행이 '+role+'이라 도움이 되는 방향으로 힘이 커집니다.':(role==='기신'||role==='구신')?'모이는 오행이 '+role+'이라 부담스러운 기운이 오히려 커질 수 있어 주의가 필요합니다.':'모이는 오행이 한신이라 영향은 크지 않습니다.';
    return label+'의 '+DZ[lz]+'가 원국과 '+e.name+'을(를) 이룹니다. '+REL_TEXT[e.type]+'. '+tail;
  }
  var zn=e.zn, gi=GUNG_INFO[e.gung];
  var nSS=SS[ssz(c,zn)], lSS=SS[ssz(c,lz)];
  var natalRole=roleOfEl(c,WX_DZ[zn]);
  var s=label+'의 '+DZ[lz]+'('+lSS+')가 '+GUNG_ZI[e.gung]+' '+DZ[zn]+'('+nSS+')와 '+TERM_NAME[e.type]+'을(를) 이룹니다. '+REL_TEXT[e.type]+'. ';
  s+=GUNG_INFO[e.gung].n+'는 '+gi.ev+'을(를) 뜻하고, '+nSS+'('+SS_INFO[ssz(c,zn)].key.split('·')[0]+' 계열)이 걸린 자리라 해당 영역에서 나타나기 쉽습니다. ';
  if(BAD_REL.indexOf(e.type)>=0){
    if(natalRole==='용신'||natalRole==='희신') s+='흔들리는 자리가 도움이 되는 기운('+natalRole+')이라 손실이 큰 편입니다.';
    else if(natalRole==='기신'||natalRole==='구신') s+='흔들리는 자리가 부담스러운 기운('+natalRole+')이라 변화 속에서 오히려 정리되는 면도 있습니다.';
  } else {
    if(natalRole==='용신'||natalRole==='희신') s+='도움이 되는 기운('+natalRole+')이 이어져 유리합니다.';
    else if(natalRole==='기신'||natalRole==='구신') s+='부담스러운 기운('+natalRole+')도 함께 강해질 수 있어 과해지지 않게 조절이 필요합니다.';
  }
  return s;
}

  var notes=[], bad=r.rel.filter(function(e){ return BAD_REL.indexOf(e.type)>=0 && e.gung!=null; });
  var byG={};
  bad.forEach(function(e){ (byG[e.gung]=byG[e.gung]||[]).push(e.type); });
  Object.keys(byG).forEach(function(k){
    var g=+k, ts=byG[k];
    var txt={0:'거주지·이동·외부 환경 변화, 조상·친척 문제',1:'직장·직위 변동, 부모형제 문제, 사회적 시비',2:'본인 건강, 배우자·가정 갈등(이사·별거 등 변화)',3:'자녀·아랫사람 문제, 계획 변경, 노후·건강 점검'}[g];
    notes.push(GUNG_INFO[g].n+'('+DZ[c.pillars[g].z]+')에 '+ts.filter(function(v,i,a){return a.indexOf(v)===i;}).join('·')+' → '+txt+'에서 변동이 예상됩니다.');
  });
  var danger=r.tags.filter(function(t){ return ['양인','백호','괴강'].indexOf(t)>=0; });
  if(danger.length && bad.length) notes.push(danger.join('·')+'의 날카로운 기운에 충·형이 겹쳐 사고·수술·급변에 각별히 주의해야 합니다(운전·무리한 운동·공사 현장 등).');
  else if(danger.length) notes.push(danger.join('·')+'의 기운이 들어와 기세가 강해지니 말과 행동이 거칠어지지 않게 조심하세요.');
  if(r.tags.indexOf('천을귀인')>=0) notes.push('천을귀인이 들어와 어려움이 닥쳐도 도와줄 사람이 나타날 가능성이 큽니다.');
  if(r.tags.some(function(t){return t.indexOf('역마')>=0;})) notes.push('역마 기운이 있어 이동·출장·이사·해외 일이 생기기 쉽습니다.');
  if(r.tags.some(function(t){return t.indexOf('도화')>=0;})) notes.push('도화 기운이 있어 인기와 이성 인연이 늘지만 구설도 함께 따릅니다.');
  if(r.tags.some(function(t){return t.indexOf('화개')>=0;})) notes.push('화개 기운이 있어 공부·정리·종교·예술 쪽으로 마음이 향합니다.');
  if(r.gmFill&&r.gmFill.length){ var fz0=r.gmFill[0], ssF=sipsungZ(c.dm,c.pillars[fz0].z); notes.push('이 해의 '+DZ[c.pillars[fz0].z]+'가 원국 공망 자리('+r.gmFill.map(function(i){return GUNG_ZI[i];}).join('·')+', '+SS[ssF]+')를 채워(출공) 그동안 비어 있던 '+SS_INFO[ssF].key+' 영역이 비로소 움직입니다. 늦게 오는 결과가 이때 나타납니다.'); }
  else if(r.gmHit) notes.push('운의 지지가 일주 기준 공망('+c.gm.map(function(z){return DZ[z];}).join('')+')에 해당하지만 원국에 채울 자리가 없어 이 해의 결과가 늦거나 기대보다 약할 수 있습니다.');
  return notes;
}

function luckAnalysis(c,idx,kind,label){
  var r=evalLuck(c,c,idx,kind), dm=dmOf(c);
  var g=idx%10, z=idx%12;
  var easy=[], term=[];
  var s1=SS_LUCK[r.ssg][0], s2=SS_LUCK[r.ssz][0];
  easy.push('<b>'+label+' '+fz(idx)+'</b>은 '+gSpan(r.grade)+' 흐름입니다. 겉으로 드러나는 기운(천간 '+TG[g]+')은 <b>'+SS[r.ssg]+'</b>, 실제 생활에 깊이 작용하는 기운(지지 '+DZ[z]+')은 <b>'+SS[r.ssz]+'</b>입니다. '+s1.replace(/입니다\.$/,'입니다.')+' 속으로는 '+s2);
  easy.push('이 사주에서 천간 오행 '+WXH[WX_TG[g]]+'은 <b>'+r.roleG+'</b>, 지지 오행 '+WXH[WX_DZ[z]]+'은 <b>'+r.roleZ+'</b>에 해당합니다. '+(r.score>=1?'도움이 되는 기운이 들어오는 시기라 노력의 성과가 비교적 잘 드러납니다.':r.score<=-1?'부담이 되는 기운이 들어오는 시기라 무리하지 말고 방어적으로 운영하는 편이 안전합니다.':'크게 좋지도 나쁘지도 않아 하기에 따라 결과가 갈리는 시기입니다.'));
  var evs=r.rel.map(function(e){ return relSentence(c,e,label); });
  var gev=r.grel.map(function(e){ return ganRelSentence(c,e,label); });
  if(evs.length||gev.length){ easy.push('<b>원국과의 상호작용</b><br>'+evs.concat(gev).map(function(t){return '· '+t;}).join('<br>')); }

/* 운의 주제 적합 점수 */
function topicLuckScore(c,t,r){
  var keys=keyList(c,t), sc=r.score;
  var roleAvg=(ROLE_SCORE[r.roleG]+ROLE_SCORE[r.roleZ])/2;
  // 주제 핵심 십성(재성·관성·인성 등)이 세운 천간/지지에 오면 크게 가산
  if(keys.length){
    var hitG=(keys.indexOf(r.ssg)>=0)?1:0;
    var hitZ=(keys.indexOf(r.ssz)>=0)?1:0;
    if(hitG||hitZ) sc+= (1.4*hitG + 1.8*hitZ) * (roleAvg>=0?1:0.4);
  }
  if(t.sub&&t.sub.length){ var h2=(t.sub.indexOf(r.ssg)>=0)+(t.sub.indexOf(r.ssz)>=0); if(h2) sc+=0.3*h2; }
  if(t.id==='love'){
    r.rel.forEach(function(e){ if(e.gung===2){ if(e.type==='육합'||e.type==='삼합'||e.type==='반합') sc+=0.9; if(e.type==='충'||e.type==='형') sc-=0.5; } });
    // 도화·홍염이 세운에 오면 이성운 가산
    if(r.tags.indexOf('홍염')>=0||r.tags.some(function(x){return x.indexOf('도화')>=0;})) sc+=0.5;
  }
  if(t.id==='money'){
    // 재성 세운이 용신/희신이면 더 가산
    if(keys.indexOf(r.ssz)>=0 && (r.roleZ==='용신'||r.roleZ==='희신')) sc+=0.6;
  }
  if(t.id==='job'){
    if(keys.indexOf(r.ssz)>=0 && (r.roleZ==='용신'||r.roleZ==='희신')) sc+=0.5;
  }
  if(t.id==='study'){
    if(keys.indexOf(r.ssz)>=0) sc+=0.7;
    if(r.tags.indexOf('문창')>=0||r.tags.indexOf('학당')>=0) sc+=0.4;
  }
  if(t.id==='health'){
    if([6,7,8,9].indexOf(r.un)>=0) sc-=0.6;
    r.rel.forEach(function(e){ if((e.gung===2||e.gung===1)&&['충','형'].indexOf(e.type)>=0) sc-=0.4; });
    if(r.tags.indexOf('양인')>=0||r.tags.indexOf('백호')>=0) sc-=0.4;
  }
  if(t.id==='move'){
    r.rel.forEach(function(e){ if(e.type==='충') sc+=0.0; });
  }
  return sc;
}
function gradeOfScore(s){ return s>=2.6?'대길':s>=1.0?'길':s>-1.0?'소길':s>-2.6?'평':'소흉'; }
function pickYear(q,sy){
  var m=q.match(/(20\d\d|19\d\d)/); if(m) return +m[1];
  if(q.indexOf('내후년')>=0) return sy+2;
  if(q.indexOf('내년')>=0) return sy+1;
  if(q.indexOf('작년')>=0) return sy-1;
  return sy;
}

  var more=[sents[2],sents[3]].filter(function(x){return x&&x.length<=110;});
  var yrs=''; try{ var by=bestYearsFor(c,t.id,nowJD,Math.max(1,ageAt(c,nowJD)|0),90,3); if(by.length) yrs='앞으로 이 분야의 흐름이 특히 좋은 해는 '+by.map(function(b){return b.y+'년('+b.age+'세)';}).join(', ')+'입니다.'; }catch(e){}
  var cand=[first,second,s2].concat(more,[yrs,fresh(s2b),fresh(s3),fresh(s4),tip]);

  return {topic:t,text:out,year:year};
}

  });
  if(best.length) goods.push('월운에서 비교적 유리한 달: '+best.map(function(b){return b.m.solarMonth+'월('+hz(b.m.idx)+')';}).join(', '));

  if(!goods.length) goods.push('두드러진 호재는 없지만 큰 방해 요소도 적어 꾸준함이 힘이 됩니다.');

var HJ_READ={'木':'목','火':'화','土':'토','金':'금','水':'수'};
TG.forEach(function(h,i){ HJ_READ[h]=TGK[i]; }); DZ.forEach(function(h,i){ HJ_READ[h]=DZK[i]; });
function lastSylAt(str,idx){
  var i=idx-1;
  while(i>=0){
    var ch=str.charAt(i);
    if(ch==='>'){ var k=str.lastIndexOf('<',i); if(k<0) break; i=k-1; continue; }
    if('」』"\'”’'.indexOf(ch)>=0){ i--; continue; }
    if(ch===')'){
      var k2=str.lastIndexOf('(',i); if(k2<0) break;
      var inner=str.slice(k2+1,i), lc=inner.charAt(inner.length-1);
      if(/[가-힣]/.test(lc)) return lc;
      i=k2-1; continue;
    }
    return ch;
  }
  return '';
}
function batchimOf(ch){
  if(!ch) return -1;
  if(HJ_READ[ch]) ch=HJ_READ[ch];
  var c=ch.charCodeAt(0);
  if(c>=0xAC00&&c<=0xD7A3) return (c-0xAC00)%28;
  if(/[0-9]/.test(ch)) return [0,8,0,16,0,0,1,8,8,0][+ch];
  return -1;
}

var RE_TOKEN=new RegExp('('+SS_WORDS+'|[甲乙丙丁戊己庚辛壬癸子丑寅卯辰巳午未申酉戌亥木火土金水])(</[a-z]+>)?(으로|은|는|이|가|을|를|과|와|로)(?![가-힣(])','g');
function pickParticle(p,b){
  if(b<0) return p;
  var has=b>0;
  if(p==='은'||p==='는') return has?'은':'는';
  if(p==='이'||p==='가') return has?'이':'가';
  if(p==='을'||p==='를') return has?'을':'를';
  if(p==='과'||p==='와') return has?'과':'와';
  if(p==='으로'||p==='로') return (has&&b!==8)?'으로':'로';
  return p;
}
function fixJosa(str){
  if(typeof str!=='string') return str;
  str=str.replace(/(\([가-힣]+\))(으로|은|는|이|가|을|를|과|와|로)(?![가-힣(])/g,function(m,w,p){ return w+pickParticle(p,batchimOf(w.charAt(w.length-2))); });
  str=str.replace(RE_TOKEN,function(m,w,tag,p){
    var b=batchimOf(w.charAt(w.length-1));
    return w+(tag||'')+pickParticle(p,b);
  });
  str=str.replace(/(을\(를\)|를\(을\)|이\(가\)|가\(이\)|은\(는\)|는\(은\)|과\(와\)|와\(과\)|\(으\)로|으로\(로\)|\(이\)라|이라\(라\)|이\(라\))/g,function(m,p,off,all){
    var b=batchimOf(lastSylAt(all,off));
    if(b<0) return m;
    var has=b>0;
    if(/^[을를]/.test(m)) return has?'을':'를';
    if(/^[이가]\(/.test(m)&&m!=='이(라)') return has?'이':'가';
    if(/^[은는]/.test(m)) return has?'은':'는';
    if(/^[과와]/.test(m)) return has?'과':'와';
    if(m==='(으)로'||m==='으로(로)') return (has&&b!==8)?'으로':'로';
    if(m==='(이)라'||m==='이라(라)'||m==='이(라)') return has?'이라':'라';
    return m;
  });
  return str;
}

var SIPI_TEXT={'지살':'새로운 터전을 잡고 움직이기 시작하는 기운','년살(도화)':'매력과 인기, 이성과 사교의 기운','월살':'막히고 메마르기 쉬워 기다림과 정리가 필요한 기운','망신살':'체면이 드러나고 노출되기 쉬우나 인지도도 얻는 기운','장성살':'우두머리 기질과 지도력, 권위와 승부의 기운','반안살':'안장에 올라앉은 형상으로 승진·안정·명예의 기운','역마살':'이동·출장·변화와 활동성의 기운','육해살':'잔병과 방해로 일이 더디게 풀리기 쉬운 기운','화개살':'학문·종교·예술과 고독, 정리와 저장의 기운','겁살':'빼앗기고 빠져나가기 쉬운 경쟁과 손재의 기운','재살':'다툼·관재·수난에 주의가 필요한 기운','천살':'불가항력의 변수와 윗사람 문제가 생기기 쉬운 기운'};
function wherePositions(w){
  var s=w.replace(/^(일간|년간|년지|일지)기준 /,''), re=/([년월일시])([지간주])/g, m, out=[], map={'년':0,'월':1,'일':2,'시':3};
  while((m=re.exec(s))) out.push({i:map[m[1]],k:m[2]});
  return out;
}
function posLabel(c,p){
  var pl=c.pillars[p.i];
  if(p.k==='간') return {nm:GUNG_GAN[p.i],ss:(p.i===2?'일간':SS[sipsung(c.dm,pl.g)]),ch:TG[pl.g]};
  if(p.k==='지') return {nm:GUNG_ZI[p.i],ss:SS[sipsungZ(c.dm,pl.z)],ch:DZ[pl.z]};
  return {nm:GUNG[p.i],ss:SS[sipsungZ(c.dm,pl.z)],ch:TG[pl.g]+DZ[pl.z]};
}
function secSinsalDetail(c){
  var ss=c.sinsal.slice(), order={'길':0,'중':1,'흉':2};
  ss.sort(function(a,b){ return order[SINSAL_INFO[a.name].t]-order[SINSAL_INFO[b.name].t]; });
  var out='';
  var gN=ss.filter(function(s){return SINSAL_INFO[s.name].t==='길';}).length, bN=ss.filter(function(s){return SINSAL_INFO[s.name].t==='흉';}).length;
  out+=box('아래는 당신의 원국에서 <b>실제로 확인된 신살과 귀인</b>만 모은 것입니다. 길신 '+gN+'개, 흉살 '+bN+'개, 길흉이 섞인 살 '+(ss.length-gN-bN)+'개가 있습니다. 신살은 같은 이름이라도 어느 자리에 있는지, 그 자리의 십성이 무엇인지, 용신과 이어지는지에 따라 작용이 달라집니다. 사주의 큰 틀(강약·격국·용신)을 넘어서는 힘은 아니므로 보조 지표로 읽으세요.','원국 신살 '+ss.map(function(s){return s.name;}).join(' · ')+' / 일주 기준 공망 '+c.gm.map(function(z){return DZ[z];}).join('·'));
  var shownPos={};
  ss.forEach(function(s){
    var inf=SINSAL_INFO[s.name], d=SINSAL_DETAIL[s.name], tcls=inf.t==='길'?'g1':inf.t==='흉'?'b1':'g0';
    var items=[];
    s.where.forEach(function(w){
      var ps=wherePositions(w);
      if(!ps.length){ items.push('<li>'+esc(w)+'</li>'); return; }
      ps.forEach(function(p){
        var L=posLabel(c,p), gm=(p.k!=='간'&&p.i!==2&&c.gm.indexOf(c.pillars[p.i].z)>=0);
        var pk='p'+p.i;
        if(shownPos[pk]) items.push('<li><b>'+L.nm+' '+L.ch+'</b>('+L.ss+') — 앞서 설명한 자리에도 함께 있습니다.</li>');
        else { shownPos[pk]=1; items.push('<li><b>'+L.nm+' '+L.ch+'</b>('+L.ss+') — '+GUNG_MEAN[p.i]+' 영역에 자리합니다. '+GUNG_INFO[p.i].ev+'에서 이 기운이 두드러집니다.'+(gm?' 이 자리는 공망이라 작용이 약하거나 늦게 나타납니다.':'')+'</li>'); }
      });
    });
    var body='<h5 style="margin:0 0 6px">'+s.name+' <span class="gr '+tcls+'">'+(inf.t==='길'?'길신':inf.t==='흉'?'흉살':'길흉 혼합')+'</span></h5>'
      +'<p style="margin:4px 0"><b>의미</b> '+inf.d+'.</p>'
      +'<p style="margin:4px 0"><b>작용</b> '+d.fx+'</p>'
      +'<p style="margin:4px 0 0"><b>내 원국에서</b></p><ul>'+items.join('')+'</ul>'
      +'<p style="margin:4px 0"><b>주의와 활용</b> '+d.cau+' 대운·세운에서 같은 글자가 다시 들어오면 이 작용이 또렷하게 나타납니다.</p>';
    out+=box(body,'신살 '+s.name+' · 위치 '+s.where.join(', ')+' · 성격 '+(inf.t==='길'?'길신':inf.t==='흉'?'흉살':'중립'));
  });

function $(i){return document.getElementById(i);}
function p2(n){ return String(n).padStart(2,'0'); }
function escH(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }


/* ===== 저장 목록 (localStorage) ===== */
var HIST_KEY='saju_history_v1';
var HIST_MAX=30;
function loadHist(){
  try{ var raw=localStorage.getItem(HIST_KEY); var arr=raw?JSON.parse(raw):[]; return Array.isArray(arr)?arr:[]; }
  catch(e){ return []; }
}
function saveHist(arr){
  try{ localStorage.setItem(HIST_KEY, JSON.stringify(arr.slice(0,HIST_MAX))); }catch(e){}
}
function histKeyOf(e){
  return [e.gender,e.y,e.m,e.d,e.h,e.mi,e.placeIdx].join('|');
}
function upsertHist(entry){
  var list=loadHist();
  var k=histKeyOf(entry);
  list=list.filter(function(x){ return histKeyOf(x)!==k; });
  entry.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  entry.savedAt=Date.now();
  list.unshift(entry);
  saveHist(list);
  return list;
}
function removeHist(id){
  var list=loadHist().filter(function(x){ return x.id!==id; });
  saveHist(list);
  return list;
}
function clearHist(){
  saveHist([]);
  return [];
}
function fillFormFromHist(e){
  $('inName').value=e.name||'';
  var radios=document.querySelectorAll('input[name=gender]');
  for(var i=0;i<radios.length;i++){ radios[i].checked=(radios[i].value===e.gender); }
  $('inDate').value=e.y+'-'+p2(e.m)+'-'+p2(e.d);
  $('inTime').value=p2(e.h)+':'+p2(e.mi);
  $('inPlace').value=String(e.placeIdx!=null?e.placeIdx:0);
  $('inErr').textContent='';
}
function renderHist(){
  var list=loadHist();
  var box=$('histList'), empty=$('histEmpty'), clr=$('histClear');
  if(!box) return;
  box.innerHTML='';
  if(!list.length){
    if(empty) empty.hidden=false;
    if(clr) clr.hidden=true;
    return;
  }
  if(empty) empty.hidden=true;
  if(clr) clr.hidden=false;
  list.forEach(function(e){
    var item=document.createElement('div');
    item.className='hist-item';
    item.setAttribute('role','button');
    item.setAttribute('tabindex','0');
    var title=(e.name&&e.name.trim())?escH(e.name):'이름 없음';
    var sub=e.y+'.'+p2(e.m)+'.'+p2(e.d)+' '+p2(e.h)+':'+p2(e.mi)+' · '+(e.gender==='M'?'남':'여')+' · '+(e.place||'');
    item.innerHTML='<div class="meta"><b>'+title+'</b><span>'+escH(sub)+'</span></div><button type="button" class="del" title="삭제" aria-label="삭제">×</button>';
    item.addEventListener('click',function(ev){
      if(ev.target.closest('.del')) return;
      fillFormFromHist(e);
      window.scrollTo({top:0,behavior:'smooth'});
    });
    item.addEventListener('keydown',function(ev){
      if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); fillFormFromHist(e); }
    });
    item.querySelector('.del').addEventListener('click',function(ev){
      ev.stopPropagation();
      removeHist(e.id);
      renderHist();
    });
    box.appendChild(item);
  });
}
if($('histClear')){
  $('histClear').addEventListener('click',function(){
    if(confirm('저장된 기록을 모두 삭제할까요?')){ clearHist(); renderHist(); }
  });
}


$('frm').addEventListener('submit',function(ev){
  ev.preventDefault(); var err=$('inErr'); err.textContent='';
  var name=$('inName').value.trim(), g=document.querySelector('input[name=gender]:checked').value, d=$('inDate').value, t=$('inTime').value;
  if(!d){ err.textContent='생년월일을 입력해 주세요.'; return; }
  if(!t){ err.textContent='태어난 시각을 입력해 주세요. 모르면 가장 가까운 시각을 넣어 주세요.'; return; }
  var dDigits=d.replace(/\D/g,'');
  if(dDigits.length!==8){ err.textContent='생년월일은 8자리 숫자로 입력해 주세요. (예: 19900515)'; return; }
  var dp=[parseInt(dDigits.slice(0,4),10), parseInt(dDigits.slice(4,6),10), parseInt(dDigits.slice(6,8),10)];
  if(dp[0]<1900||dp[0]>2099){ err.textContent='1900~2099년 사이만 지원합니다.'; return; }
  var chkD=new Date(dp[0],dp[1]-1,dp[2]);
  if(dp[1]<1||dp[1]>12||dp[2]<1||chkD.getFullYear()!==dp[0]||chkD.getMonth()!==dp[1]-1||chkD.getDate()!==dp[2]){
    err.textContent='올바른 생년월일을 입력해 주세요. (존재하지 않는 날짜입니다)'; return;
  }
  var tDigits=t.replace(/\D/g,'');
  if(tDigits.length===3) tDigits='0'+tDigits;
  if(tDigits.length!==4){ err.textContent='태어난 시각은 4자리 숫자로 입력해 주세요. (예: 0930 또는 1430)'; return; }
  var tp=[parseInt(tDigits.slice(0,2),10), parseInt(tDigits.slice(2,4),10)];
  if(tp[0]<0||tp[0]>23||tp[1]<0||tp[1]>59){
    err.textContent='태어난 시각은 00:00 ~ 23:59 사이로 입력해 주세요.'; return;
  }
  var pi=parseInt($('inPlace').value,10)||0;
  var pl=PLACES[pi]||PLACES[0];
  var INP={name:name,gender:g,y:dp[0],m:dp[1],d:dp[2],h:tp[0],mi:tp[1],lon:pl[1],place:pl[0],correction:'lon',dayChange:'zero',dst:true};
  /* 저장 목록에 기록 */
  upsertHist({name:name,gender:g,y:dp[0],m:dp[1],d:dp[2],h:tp[0],mi:tp[1],placeIdx:pi,place:pl[0]});
  renderHist();
  var R; try{ R=plainReport(INP); }catch(e){ err.textContent='분석 중 오류가 발생했습니다: '+e.message; return; }
  var who=name?escH(name)+'님':'당신';
  var birthStr=INP.y+'년 '+INP.m+'월 '+INP.d+'일 '+p2(INP.h)+'시 '+p2(INP.mi)+'분 · '+(INP.gender==='M'?'남':'여');
  var nameLine=name?escH(name)+'님':'';
  $('rTitle').textContent=(name?name+'님의 ':'')+'인생 이야기';
  $('rSub').innerHTML=(nameLine?'<b style="font-size:16px">'+nameLine+'</b><br>':'')+birthStr+'<br><b>'+escH(R.ilju)+'</b>';
  document.title=(name||'나의')+'-사는 이야기';
  $('toc').innerHTML=R.nav; $('rBody').innerHTML=R.body;
  $('vIn').hidden=true; $('vOut').hidden=false; window.scrollTo(0,0);
  Array.prototype.forEach.call($('toc').querySelectorAll('a'),function(a){ a.addEventListener('click',function(e){ e.preventDefault(); var el=$(a.getAttribute('href').slice(1)); if(el){ var top=el.getBoundingClientRect().top+window.pageYOffset-$('toc').offsetHeight-12; window.scrollTo({top:top,behavior:'smooth'}); } }); });
});
$('inDate').addEventListener('input',function(e){
  var v=e.target.value.replace(/\D/g,'').slice(0,8);
  if(v.length>6) e.target.value=v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6);
  else if(v.length>4) e.target.value=v.slice(0,4)+'-'+v.slice(4);
  else e.target.value=v;
});
$('inTime').addEventListener('input',function(e){
  var v=e.target.value.replace(/\D/g,'').slice(0,4);
  if(v.length>2) e.target.value=v.slice(0,2)+':'+v.slice(2);
  else e.target.value=v;
});
$('again').addEventListener('click',function(){ $('vOut').hidden=true; $('vIn').hidden=false; document.title='나의 인생 이야기'; renderHist(); window.scrollTo(0,0); });


/* 페이지 로드 시 저장 목록 표시 */
renderHist();


</script></body></html>
